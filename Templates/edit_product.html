

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product | IMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: #f3f6fa;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .page-header {
            background: #19375b;
            color: white;
            padding: 25px 35px;
        }

        .page-header h1 {
            margin: 0;
        }

        .container {
            max-width: 750px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5df;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .btn {
            background: #19375b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secondary {
            background: #64748b;
        }
        .alert {
    padding: 14px 18px;
    border-radius: 6px;
    margin: 15px 0 20px;
    font-weight: bold;
}

.alert-error {
    background: #fde8e8;
    color: #b91c1c;
    border: 1px solid #f5b5b5;
}

.alert-success {
    background: #e5f7ed;
    color: #166534;
    border: 1px solid #a7e3bc;
}
    </style>
</head>

<body>

<header class="page-header">
    <h1>Inventory Management System</h1>
    <p>Edit Product Details</p>
</header>

<main class="container">
    <div class="form-card">

        <h2>✏️ Edit Product</h2>
        <p>Update the product information below.</p>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert {{ 'alert-error' if category == 'error' else 'alert-success' }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}


        <form method="POST"
              action="{{ url_for('edit_product', product_id=product.product_id) }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="product_name">Product Name</label>
                <input type="text"
                       id="product_name"
                       name="product_name"
                       value="{{ product.product_name }}"
                       required>
            </div>

            <div class="form-group">
                <label for="sku">SKU</label>
                <input type="text"
                       id="sku"
                       name="sku"
                       value="{{ product.sku }}"
                       required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text"
                       id="category"
                       name="category"
                       value="{{ product.category or '' }}">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"
                          name="description">{{ product.description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="unit_price">Unit Price ($)</label>
                <input type="number"
                       id="unit_price"
                       name="unit_price"
                       min="0"
                       max="99999999.99"
                       step="0.01"
                       value="{{ product.unit_price }}"
                       required>
            </div>

            <div class="form-group">
                <label for="quantity_in_stock">Quantity in Stock</label>
                <input type="number"
                       id="quantity_in_stock"
                       name="quantity_in_stock"
                       min="0"
                       step="1"
                       value="{{ product.quantity_in_stock }}"
                       required>
            </div>

            <div class="form-group">
                <label for="reorder_level">Reorder Level</label>
                <input type="number"
                       id="reorder_level"
                       name="reorder_level"
                       min="0"
                       step="1"
                       value="{{ product.reorder_level }}"
                       required>
            </div>

            <div class="actions">
                <button type="submit" class="btn">
                    Save Changes
                </button>

                <a href="{{ url_for('search_product') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</main>

</body>
</html>
